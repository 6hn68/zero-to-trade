<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" font-family="-apple-system, 'Segoe UI', 'Noto Sans SC', sans-serif">
<title>zero-to-trade 七环节外贸工作流</title>
<desc>从选市场到订单交付的七个环节，每环节标注做什么与产出物。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="900" height="560" fill="#ffffff"/>
<text x="40" y="46" font-size="22" font-weight="600" fill="#0f172a">七环节外贸工作流</text>
<text x="40" y="72" font-size="13" fill="#64748b">AI 干重活（调研 / 起草 / 排计划），人做判断（分级 / 拍板 / 谈判）</text>

<!-- axis line -->
<line x1="70" y1="120" x2="70" y2="500" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arb)"/>
<text x="70" y="524" font-size="11" fill="#1d4ed8" text-anchor="middle">时间轴 · 每一步都有产出物才往下走</text>

<!-- steps -->
<g>
<rect x="96" y="96" width="286" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="112" y="115" font-size="13" font-weight="600" fill="#0f172a">01选市场</text>
<text x="112" y="133" font-size="12" fill="#475569">语言 · 需求 · 壁垒三维评估</text>
<rect x="394" y="96" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="115" font-size="11" fill="#64748b">产出</text>
<text x="408" y="133" font-size="12" fill="#0f172a">1 个首站市场</text>
</g>
<line x1="234" y1="142" x2="234" y2="158" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

<g>
<rect x="96" y="158" width="286" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="112" y="177" font-size="13" font-weight="600" fill="#0f172a">02 找客户</text>
<text x="112" y="195" font-size="12" fill="#475569">海关 / 社媒 / 搜索 / 展会四路</text>
<rect x="394" y="158" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="177" font-size="11" fill="#64748b">产出</text>
<text x="408" y="195" font-size="12" fill="#0f172a">每天 ≥20 条真线索</text>
</g>
<line x1="234" y1="204" x2="234" y2="220" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

<g>
<rect x="96" y="220" width="286" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="112" y="239" font-size="13" font-weight="600" fill="#0f172a">03 背调客户</text>
<text x="112" y="257" font-size="12" fill="#475569">L1 筛查 / L2 标准 / L3 深度</text>
<rect x="394" y="220" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="239" font-size="11" fill="#64748b">产出</text>
<text x="408" y="257" font-size="12" fill="#0f172a">A/B/C 评级</text>
</g>
<line x1="234" y1="266" x2="234" y2="282" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

<g>
<rect x="96" y="282" width="286" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="112" y="301" font-size="13" font-weight="600" fill="#0f172a">04 建联客户</text>
<text x="112" y="319" font-size="12" fill="#475569">T0–T3 分级 · 三线并进首触</text>
<rect x="394" y="282" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="301" font-size="11" fill="#64748b">产出</text>
<text x="408" y="319" font-size="12" fill="#0f172a">分级名单 + 7 天计划</text>
</g>
<line x1="234" y1="328" x2="234" y2="344" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

<g>
<rect x="96" y="344" width="286" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="112" y="363" font-size="13" font-weight="600" fill="#0f172a">05 聊单</text>
<text x="112" y="381" font-size="12" fill="#475569">小要求先行 · 报价永远最后</text>
<rect x="394" y="344" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="363" font-size="11" fill="#64748b">产出</text>
<text x="408" y="381" font-size="12" fill="#0f172a">规格/数量/目的港</text>
</g>
<line x1="234" y1="390" x2="234" y2="406" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

<g>
<rect x="96" y="406" width="286" height="46" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1"/>
<text x="112" y="425" font-size="13" font-weight="600" fill="#0f172a">06 报价谈判</text>
<text x="112" y="443" font-size="12" fill="#475569">报价纪律 · 让步换条件</text>
<rect x="394" y="406" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="425" font-size="11" fill="#64748b">产出</text>
<text x="408" y="443" font-size="12" fill="#0f172a">报价单 + 让步阶梯</text>
</g>
<line x1="234" y1="452" x2="234" y2="468" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ar)"/>

<g>
<rect x="96" y="468" width="286" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
<text x="112" y="487" font-size="13" font-weight="600" fill="#0f172a">07 订单交付</text>
<text x="112" y="505" font-size="12" fill="#475569">合同 / 生产 / 验货 / 单证 / 收款 / 物流</text>
<rect x="394" y="468" width="140" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="408" y="487" font-size="11" fill="#64748b">产出</text>
<text x="408" y="505" font-size="12" fill="#0f172a">复购日历</text>
</g>

<!-- loop back -->
<path d="M534 491 C600 491 600 300 540 300" fill="none" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="612" y="396" font-size="11" fill="#059669">交付完把客户</text>
<text x="612" y="412" font-size="11" fill="#059669">推回复购/ 转介绍</text>

<!-- legend -->
<text x="640" y="150" font-size="11" fill="#64748b">纪律三条</text>
<text x="640" y="172" font-size="11" fill="#0f172a">1报价永远最后一步</text>
<text x="640" y="192" font-size="11" fill="#0f172a">2 每级只顶一级</text>
<text x="640" y="212" font-size="11" fill="#0f172a">3 跟进最多三次</text>
</svg>
